services:
  nats:
    image: nats:2.11-alpine
    command: ["-js", "-m", "8222"]
    ports: ["4222:4222", "8222:8222"]
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: school, POSTGRES_USER: platform, POSTGRES_PASSWORD: platform }
    volumes: ["db-data:/var/lib/postgresql/data", "./db/school-platform-schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d school"]
      interval: 5s
      timeout: 5s
      retries: 10
  intake:
    build: { context: ., dockerfile: deploy/Dockerfile.intake }
    environment: { DATABASE_URL: postgres://platform:platform@db:5432/school?sslmode=disable, NATS_URL: nats://nats:4222, JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET}", CORS_ORIGINS: "http://localhost:8082,http://localhost:5500" }
    depends_on:
      db:
        condition: service_healthy
      nats:
        condition: service_started
    restart: unless-stopped
    ports: ["8080:8080"]
  academic:
    build: { context: ., dockerfile: deploy/Dockerfile.academic }
    environment: { DATABASE_URL: postgres://platform:platform@db:5432/school?sslmode=disable, INTAKE_URL: http://intake:8080, NATS_URL: nats://nats:4222, JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET}" }
    depends_on:
      db:
        condition: service_healthy
      nats:
        condition: service_started
    restart: unless-stopped
    ports: ["8082:8082"]
  fees:
    build: { context: ., dockerfile: deploy/Dockerfile.fees }
    environment: { DATABASE_URL: postgres://platform:platform@db:5432/school?sslmode=disable, INTAKE_URL: http://intake:8080, NATS_URL: nats://nats:4222, JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET}", MPESA_CALLBACK_SECRET: "${MPESA_CALLBACK_SECRET:?set MPESA_CALLBACK_SECRET}", MPESA_CALLBACK_HMAC_SECRET: "${MPESA_CALLBACK_HMAC_SECRET:-}", MPESA_BASE_URL: "${MPESA_BASE_URL:-https://sandbox.safaricom.co.ke}", MPESA_CONSUMER_KEY: "${MPESA_CONSUMER_KEY:-}", MPESA_CONSUMER_SECRET: "${MPESA_CONSUMER_SECRET:-}", MPESA_SHORTCODE: "${MPESA_SHORTCODE:-}", MPESA_PASSKEY: "${MPESA_PASSKEY:-}", MPESA_CALLBACK_URL: "${MPESA_CALLBACK_URL:-}" }
    depends_on:
      db:
        condition: service_healthy
      nats:
        condition: service_started
    restart: unless-stopped
    ports: ["8081:8081"]
  fees-worker:
    build: { context: ., dockerfile: deploy/Dockerfile.fees }
    entrypoint: ["/usr/local/bin/fees-worker"]
    environment: { DATABASE_URL: postgres://platform:platform@db:5432/school?sslmode=disable }
    depends_on:
      db:
        condition: service_healthy
      nats:
        condition: service_started
    restart: unless-stopped
  web:
    build: { context: ., dockerfile: deploy/Dockerfile.web }
    environment: { INTAKE_URL: http://intake:8080, ACADEMIC_URL: http://academic:8082, FEES_URL: http://fees:8081 }
    depends_on: [intake, academic, fees]
    ports: ["5500:5500"]
volumes:
  db-data:
