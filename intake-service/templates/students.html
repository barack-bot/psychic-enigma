<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Manage students</title>
	<style>
		:root { color: #2b1a1c; font-family: Manrope, Arial, sans-serif; background: #fcfaf7; }
		body { margin: 0; }
		main { max-width: 1240px; margin: auto; padding: 48px 5vw; }
		h1 { margin: 8px 0 24px; font: 400 52px/1.05 Georgia, serif; }
		h2 { margin-top: 0; font-size: 20px; }
		.kicker { color: #7b1e2b; font-size: 11px; font-weight: 800; letter-spacing: .15em; text-transform: uppercase; }
		.panel { background: #fff; border: 1px solid #e7dedd; padding: 24px; margin-bottom: 24px; }
		form { display: grid; gap: 16px; }
		.fields { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
		label { display: grid; gap: 6px; color: #6d5b5e; font-size: 11px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; }
		input, select { width: 100%; box-sizing: border-box; border: 1px solid #e7dedd; padding: 11px; background: #fffaf5; color: #2b1a1c; font: inherit; }
		button { border: 0; padding: 12px 16px; background: #7b1e2b; color: #fff; font: 800 11px Manrope, Arial, sans-serif; cursor: pointer; }
		button.secondary { background: transparent; border: 1px solid #7b1e2b; color: #7b1e2b; }
		button.danger { background: #9a3d35; }
		.actions { display: flex; gap: 8px; }
		.status { min-height: 20px; margin: 0; color: #9a3d35; }
		.table-wrap { overflow-x: auto; }
		table { width: 100%; border-collapse: collapse; font-size: 13px; }
		th, td { padding: 12px 10px; border-bottom: 1px solid #e7dedd; text-align: left; white-space: nowrap; }
		th { color: #6d5b5e; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
		#login-panel { max-width: 460px; margin: 8vh auto; }
		@media (max-width: 760px) { .fields { grid-template-columns: 1fr; } h1 { font-size: 42px; } }
	</style>
</head>
<body>
	<main>
		<section id="app" hidden>
			<p class="kicker">Admissions administration</p>
			<h1>Manage students</h1>
			<section class="panel">
				<h2 id="form-title">Add student</h2>
				<form id="student-form">
					<div class="fields">
						<label>Name<input name="name" required></label>
						<label>ID number<input name="id_number" required></label>
						<label>Date of birth<input name="date_of_birth" type="date" required></label>
						<label>Email<input name="email" type="email"></label>
						<label>Phone number<input name="phone_number"></label>
						<label>Admission number<input name="admission_number"></label>
						<label>Initial password<input name="initial_password" type="password" placeholder="Optional"></label>
						<label>KCSE index number<input name="kcse_index_number"></label>
						<label>KCSE year<input name="kcse_year" type="number" min="2000" max="2100"></label>
						<label>KCPE index number<input name="kcpe_index_number"></label>
						<label>KCPE year<input name="kcpe_year" type="number" min="2000" max="2100"></label>
						<label>Parent name<input name="parent_name"></label>
						<label>Parent phone<input name="parent_phone_number"></label>
						<label>County<input name="county"></label>
						<label>Ward<input name="ward"></label>
						<label>Location<input name="location"></label>
						<label>Village<input name="village"></label>
						<label>Status<select name="status"><option>ACTIVE</option><option>SUSPENDED</option><option>WITHDRAWN</option><option>GRADUATED</option></select></label>
					</div>
					<div class="actions"><button id="save-button" type="submit">Create student</button><button id="cancel-button" class="secondary" type="button" hidden>Cancel edit</button></div>
					<p id="form-status" class="status" role="status"></p>
				</form>
			</section>
			<section class="panel">
				<h2>Bulk import students</h2>
				<form id="import-form">
					<label>CSV file<input name="file" type="file" accept=".csv,text/csv" required></label>
					<button type="submit">Import students</button>
					<p id="import-status" class="status" role="status"></p>
				</form>
			</section>
			<section class="panel">
				<div class="actions"><h2 style="margin-right:auto">Student records</h2><button id="refresh-button" class="secondary" type="button">Refresh</button><button id="sign-out" class="secondary" type="button">Sign out</button></div>
				<p id="list-status" class="status" role="status"></p>
				<div class="table-wrap"><table><thead><tr><th>ID</th><th>Name</th><th>ID number</th><th>Date of birth</th><th>Email</th><th>Phone</th><th>Admission no.</th><th>Status</th><th>Actions</th></tr></thead><tbody id="students"></tbody></table></div>
			</section>
			<section class="panel">
				<div class="actions"><h2 style="margin-right:auto">Applications</h2><button id="refresh-applications" class="secondary" type="button">Refresh</button></div>
				<p id="applications-status" class="status" role="status"></p>
				<div class="table-wrap"><table><thead><tr><th>ID</th><th>Name</th><th>Course</th><th>Phone</th><th>Status</th><th>Actions</th></tr></thead><tbody id="applications"></tbody></table></div>
			</section>
		</section>
	</main>
	<script src="/static/js/students.js"></script>
</body>
</html>
