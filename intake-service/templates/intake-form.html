<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Apply | Kitutu Chache TVC</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
	<style>
		:root {
			--ink: #2b1a1c;
			--muted: #6d5b5e;
			--purple: #7b1e2b;
			--deep: #4d101c;
			--paper: #fcfaf7;
			--line: #e7dedd;
			--lime: #b8c987;
			--soft: #fffaf5;
		}
		* { box-sizing: border-box; }
		body {
			margin: 0;
			background: linear-gradient(180deg, #f7f2f1 0%, #fcfaf7 100%);
			color: var(--ink);
			font-family: Manrope, Arial, sans-serif;
		}
		a { color: inherit; text-decoration: none; }
		main.shell {
			max-width: 980px;
			margin: 0 auto;
			padding: 48px 20px 72px;
		}
		.topbar {
			display: flex;
			justify-content: space-between;
			align-items: center;
			gap: 16px;
			margin-bottom: 24px;
		}
		.brand { font-size: 0.78rem; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 800; color: var(--purple); }
		.link {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			min-height: 42px;
			padding: 0 18px;
			border: 1px solid var(--line);
			background: #fff;
			border-radius: 999px;
			font-size: 0.8rem;
			font-weight: 700;
		}
		.panel {
			background: #fff;
			border: 1px solid var(--line);
			box-shadow: 0 18px 40px rgba(43, 26, 28, 0.06);
			border-radius: 18px;
			padding: 32px;
		}
		.intro {
			margin-bottom: 28px;
			padding: 28px 32px;
		}
		.kicker {
			margin: 0 0 12px;
			color: var(--purple);
			font-size: 0.72rem;
			letter-spacing: 0.18em;
			font-weight: 800;
			text-transform: uppercase;
		}
		h1 {
			margin: 0 0 10px;
			font-family: "DM Serif Display", Georgia, serif;
			font-size: clamp(2.5rem, 5vw, 4rem);
			line-height: 1.05;
			font-weight: 400;
		}
		.intro p { margin: 0; color: var(--muted); line-height: 1.7; }
		form {
			display: grid;
			gap: 18px;
		}
		.fields {
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			gap: 18px;
		}
		label {
			display: grid;
			gap: 8px;
			font-size: 0.72rem;
			letter-spacing: 0.08em;
			text-transform: uppercase;
			font-weight: 800;
			color: var(--muted);
		}
		label.full {
			grid-column: 1 / -1;
		}
		input, select, textarea {
			width: 100%;
			padding: 13px 14px;
			font: inherit;
			border: 1px solid var(--line);
			background: var(--soft);
			border-radius: 10px;
			color: var(--ink);
		}
		textarea {
			min-height: 140px;
			resize: vertical;
		}
		button {
			border: 0;
			background: var(--purple);
			color: #fff;
			padding: 14px 18px;
			border-radius: 10px;
			font: 800 0.75rem Manrope, Arial, sans-serif;
			letter-spacing: 0.08em;
			text-transform: uppercase;
			cursor: pointer;
		}
		button:hover { background: var(--deep); }
		.status {
			min-height: 22px;
			margin: 0;
			font-size: 0.92rem;
			color: var(--purple);
		}
		@media (max-width: 700px) {
			.fields { grid-template-columns: 1fr; }
			.panel { padding: 22px; }
		}
	</style>
</head>
<body>
	<main class="shell">
		<div class="topbar">
			<div class="brand">Kitutu Chache TVC</div>
			<a class="link" href="/">Back to portal</a>
		</div>
		<section class="intro panel">
			<p class="kicker">Admissions</p>
			<h1>Submit your application.</h1>
			<p>Complete the form below to apply for a programme at Kitutu Chache TVC. Your application will be reviewed by the admissions office.</p>
		</section>
		<form id="intake-form" class="panel">
			<div class="fields">
				<label>Full name<input name="full_name" required autocomplete="name"></label>
				<label>Email<input name="email" type="email" required autocomplete="email"></label>
				<label>Phone number<input name="phone" type="tel" required autocomplete="tel"></label>
				<label>Date of birth<input name="date_of_birth" type="date" required></label>
				<label>Preferred course<select name="course" required>
					<option value="">Select a programme</option>
					<option>Certificate in Computer Applications</option>
					<option>Diploma in Electrical Engineering</option>
					<option>Certificate in Automotive Engineering</option>
					<option>Diploma in Business Management</option>
					<option>Certificate in Information Technology</option>
					<option>Certificate in Fashion Design</option>
					<option>Certificate in Hospitality Management</option>
					<option>Artisan in Plumbing and Pipe Fitting</option>
				</select></label>
				<label>Previous school<input name="previous_school"></label>
				<label class="full">Message<textarea name="message" placeholder="Tell us a little about your interest in this programme."></textarea></label>
			</div>
			<button type="submit">Submit application</button>
			<p id="form-status" class="status" role="status"></p>
		</form>
	</main>
	<script src="/static/js/app.js"></script>
</body>
</html>
